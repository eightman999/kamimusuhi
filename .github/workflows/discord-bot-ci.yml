name: Discord Bot

on:
  push:
    paths:
      - 'deploy/resident/discord*'
      - 'deploy/resident/test_discord_bot.py'
      - '.github/workflows/discord-bot-ci.yml'
  pull_request:
    paths:
      - 'deploy/resident/discord*'
      - 'deploy/resident/test_discord_bot.py'
      - '.github/workflows/discord-bot-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r deploy/resident/discord-requirements.txt
      - run: python -m unittest discover -s deploy/resident -p 'test_discord_bot.py' -v
