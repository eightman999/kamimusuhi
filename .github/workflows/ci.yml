name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record reproducible source evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ci-audit"
          git rev-parse HEAD > "$RUNNER_TEMP/ci-audit/revision.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/ci-audit/source.tar.gz" HEAD
          rustup show active-toolchain | tee "$RUNNER_TEMP/ci-audit/toolchain.txt"
      - name: Run the repository's local CI gate
        shell: bash
        run: bash scripts/ci-local.sh 2>&1 | tee "$RUNNER_TEMP/ci-audit/ci.log"
      - name: Preserve source and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-audit-${{ github.sha }}
          path: ${{ runner.temp }}/ci-audit/
          if-no-files-found: warn
          retention-days: 7
