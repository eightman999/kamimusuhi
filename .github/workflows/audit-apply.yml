name: Validate reviewed spec audit

on:
  push:
    branches: [fix/spec-implementation-audit-20260910]
    paths: ['.audit/**', '.github/workflows/audit-apply.yml']

permissions:
  contents: read

concurrency:
  group: reviewed-spec-audit-20260910
  cancel-in-progress: true

jobs:
  validate:
    if: github.ref == 'refs/heads/fix/spec-implementation-audit-20260910'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Apply the reviewed patch and remove temporary audit plumbing
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/spec-audit"
          git rev-parse HEAD > "$RUNNER_TEMP/spec-audit/base-revision.txt"
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          encoded = ''.join(pathlib.Path(f'.audit/code-patch.{i}').read_text().strip() for i in range(3))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '965949fcb8e61fa2ec7387766c1e539f27cada04c757497fd90b3ba8d4baffde'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          for i in range(3):
              pathlib.Path(f'.audit/code-patch.{i}').unlink()
          pathlib.Path('.github/workflows/audit-apply.yml').unlink()
          PY
          cargo fmt --all
          git add -A
      - name: Verify the complete local CI gate
        shell: bash
        run: bash scripts/ci-local.sh 2>&1 | tee "$RUNNER_TEMP/spec-audit/ci.log"
      - name: Verify two regression tests detect deliberate invariant violations
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'spec-audit'
          cases = [
              ('framing', 'crates/kamimusuhi-resource-http/src/http.rs',
               'if body_bytes.len() != length {', 'if false {',
               ['cargo', 'test', '-p', 'kamimusuhi-resource-http', 'framing_rejects_truncation_even_when_the_body_is_valid_json']),
              ('privacy', 'crates/kamimusuhi-runtime/src/scenario.rs',
               'runtime.config().persona.check_privacy(options.privacy)?;', '// deliberate privacy bypass for a mutation test',
               ['cargo', 'test', '-p', 'kamimusuhi-runtime', '--test', 'persona_boundary', 'persona_dispatch_obeys_the_turn_privacy_boundary_without_entering_the_router']),
          ]
          for label, filename, needle, mutation, command in cases:
              path = pathlib.Path(filename)
              source = path.read_text()
              assert source.count(needle) == 1
              try:
                  path.write_text(source.replace(needle, mutation))
                  result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  (out / f'mutation-{label}.log').write_text(result.stdout)
                  assert result.returncode != 0 and 'test result: FAILED' in result.stdout, label
                  print(f'{label}: regression test rejected the deliberate mutation')
              finally:
                  path.write_text(source)
          PY
          git diff --exit-code
          bash scripts/ci-local.sh 2>&1 | tee "$RUNNER_TEMP/spec-audit/ci-restored.log"
      - name: Commit and fast-forward only the audit branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: enforce Persona privacy and preserve attributed input across bounded HTTP boundaries'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" git push origin HEAD:refs/heads/fix/spec-implementation-audit-20260910
      - name: Record exact source and validation evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/spec-audit"
          git rev-parse HEAD > "$RUNNER_TEMP/spec-audit/revision.txt"
          git write-tree > "$RUNNER_TEMP/spec-audit/tree.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/spec-audit/source.tar.gz" "$(git write-tree)"
          git diff --cached --binary > "$RUNNER_TEMP/spec-audit/remaining.patch"
          rustup show active-toolchain > "$RUNNER_TEMP/spec-audit/toolchain.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: spec-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/spec-audit/
          retention-days: 7
