name: MIOBA Python CI

on:
  push:
    paths:
      - 'experiments/mioba/**'
      - '.github/workflows/mioba-python-ci.yml'
  pull_request:
    paths:
      - 'experiments/mioba/**'
      - '.github/workflows/mioba-python-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mioba-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    # CPU only. GPU-specific behaviour (P100 / RTX 3060) is human
    # validation, see experiments/mioba/README.md "Human GPU validation".
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: experiments/mioba/requirements.txt
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r experiments/mioba/requirements.txt
      - name: Import / compile check
        run: |
          python -m compileall -q experiments/mioba
          python -c "import experiments.mioba.cli, experiments.mioba.coordinator.app, experiments.mioba.workers.worker, experiments.mioba.fba.torch_backend, experiments.mioba.coordinator.replay"
      - name: CLI smoke
        run: python -m experiments.mioba.cli --help
      - name: pytest experiments/mioba/tests
        run: python -m pytest experiments/mioba/tests -q --junitxml=$RUNNER_TEMP/mioba-junit.xml
      - name: Backend smoke A/B on CPU (mock + torch), coordinator/workers/resume smoke (C, D, E, G, H)
        env:
          MIOBA_PYTHON: python
        run: |
          set -o pipefail
          OUT="$RUNNER_TEMP/smoke"; mkdir -p "$OUT"
          bash experiments/mioba/scripts/smoke_a_b_backend.sh --device cpu --backend mock  --out "$OUT/ab_mock.json"  2>&1 | tee "$OUT/ab_mock.log"
          bash experiments/mioba/scripts/smoke_a_b_backend.sh --device cpu --backend torch --out "$OUT/ab_torch.json" 2>&1 | tee "$OUT/ab_torch.log"
          bash experiments/mioba/scripts/smoke_c_two_workers.sh 2>&1 | tee "$OUT/c.log"
          bash experiments/mioba/scripts/smoke_d_genome_eval.sh 2>&1 | tee "$OUT/d.log"
          bash experiments/mioba/scripts/smoke_e_resume.sh 2>&1 | tee "$OUT/e.log"
          bash experiments/mioba/scripts/smoke_g_pause_stop.sh 2>&1 | tee "$OUT/g.log"
          bash experiments/mioba/scripts/smoke_h_worker_loss.sh 2>&1 | tee "$OUT/h.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mioba-ci-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mioba-junit.xml
            ${{ runner.temp }}/smoke/
          if-no-files-found: warn
          retention-days: 7
