[workspace]
resolver = "2"
members = [
    "crates/kamimusuhi-core",
    "crates/kamimusuhi-store-sqlite",
    "crates/kamimusuhi-resource-http",
    "crates/kamimusuhi-testkit",
    "crates/kamimusuhi-runtime",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["json"] }
tempfile = "3"
anyhow = "1"
