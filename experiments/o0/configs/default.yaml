# O0 default config (ID: occlusion 4-16 steps, single target + distractors)
name: default
seed: 0

env:
  world_len: 4.0
  horizon: 96
  occ_lo: 4
  occ_hi: 16
  v_lo: 0.04
  v_hi: 0.09
  drag: 0.005
  accel_std: 0.0005
  v_noise: 0.002
  p_gone: 0.2
  p_swap: 0.3
  distractor_probs: [0.2, 0.3, 0.3, 0.1, 0.1]

train:
  updates: 2000
  batch_size: 64
  lr: 0.001
  w_pos: 5.0
  w_occ: 4.0
  w_vis: 0.25
  w_exist: 1.0
  w_id: 1.0
  val_every: 25
  val_episodes: 256
  device: cpu

eval:
  episodes: 512
  seed: 910000

model:
  arch: gru64
