name: u0_default
env:
  episode_len: 192
  num_locations: 6
  memory_slots: 4
  evict_policy: fifo
  event_start: 12
  event_spacing: 6
  event_jitter: 2
  n_distractors: 4
  noise_rate: 0.25
  sites_per_function: 2
  potency_rich: 1.0
  potency_meager: 0.45
  needs_per_episode: 2
  delay_min: 24
  delay_max: 80
  need_gap_min: 8
  need_gap_max: 24
  need_beta: 6.0
  need_floor: 0.05
  resolve_margin: 32
  crisis_drain: 0.030
  crisis_temp_rate: 0.020
  crisis_risk_rate: 0.020
  passive_energy: 0.0025
  temp_relax: 0.02
  ambient_amp: 0.10
  ambient_period: 240
  ambient_noise: 0.01
  risk_mean: 0.15
  risk_relax: 0.02
  risk_noise: 0.015
  risk_spike_prob: 0.008
  risk_spike_lo: 0.10
  risk_spike_hi: 0.30
  cert_mean: 0.55
  cert_relax: 0.010
  state_noise: 0.004
  ignore_energy: 0.001
  wait_energy: 0.010
  wait_temp_shelter: 0.03
  wait_risk: 0.012
  wait_cert: 0.004
  move_energy: 0.004
  act_energy: 0.003
  act_boost: 0.10
  act_wrong_energy: 0.040
  store_cost: 0.005
  recall_cost: 0.005
  death_penalty: 2.0
  death_forfeit: 0.05
  init_perturb_prob: 0.5
  init_perturb_lo: 0.05
  init_perturb_hi: 0.18

train:
  iters: 400
  num_envs: 32
  lr: 0.0003
  epochs: 3
  minibatch_episodes: 32
  clip: 0.2
  gamma: 0.99
  lam: 0.95
  vf_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5
  eval_every: 10
  eval_episodes: 64
  val_seed: 700001
  imitation_iters: 0
  checkpoint_every: 10
