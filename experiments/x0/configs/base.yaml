# X0 base config: cross-modal binding
seed: 0
name: base
env:
  factors: [4, 4, 4]          # 64 compositional causes
  holdout: [2, 2]             # f0>=2 AND f1>=2 held out (X-C5)
  modalities: [vis, aud, temp, mot]
  n_events: 6
  T: 16
  lag: 2
  token_drop_p: 0.1
  modality_drop_p: 0.1
  noise: 0.1
  conflict_delta: 2
  conflict_pair: [vis, aud]
  n_train_scenes: 8192
  n_val_scenes: 512
model:
  kind: binder
  d_z: 32
  hidden: 64
  tau: 0.2
  window: 3
  contra_weight: 1.0
  recon_weight: 0.5
  ae_weight: 1.0
  cross_weight: 1.0
train:
  steps: 400
  batch_scenes: 128
  lr: 0.001
  val_every: 20
  threads: 4
  device: cpu
eval:
  scenes: 512
  lags: [0, 1, 2, 4, 8]
  conflict_deltas: [1, 2]
  drop_rates: [0.0, 0.25, 0.5]
  alt_noise: 0.3
