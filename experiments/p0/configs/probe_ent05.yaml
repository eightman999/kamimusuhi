# Invariance probe (round-3 review, M-2): does the late-training IGNORE
# collapse depend on the entropy coefficient? Same as base but
# ent_coef 0.02 -> 0.05 and a shorter budget.
name: probe_ent05
seed: 0

env:
  episode_length: 512
  p_event: 0.012
  d_ramp_steps: 5
  d_event_steps: 1
  cd_coupling_mult: 10.0
  cost_observe: 0.02
  cost_observe_all: 0.06
  detect_bonus: 1.0
  miss_penalty: 1.0

train:
  total_steps: 150000
  rollout_steps: 128
  num_envs: 8
  ppo_epochs: 4
  minibatch_size: 256
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  ent_coef: 0.05
  vf_coef: 0.5
  max_grad_norm: 0.5
  eval_every_updates: 5
  eval_episodes: 6
  device: cpu

eval:
  episodes: 12

agent:
  kind: mlp
  hidden: 64

predictor:
  hidden: 32
  lr: 0.003
  ema: 0.5
  err_scale: 4.0
