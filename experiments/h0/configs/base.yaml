# H0 base config (Environment A / ID)
name: base
seed: 0

env:
  episode_length: 1024

train:
  total_steps: 300000
  rollout_steps: 2048
  num_envs: 8
  ppo_epochs: 4
  minibatch_size: 256
  lr: 0.001
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  eval_every_updates: 5
  eval_episodes: 8
  device: cpu

eval:
  episodes: 20

agent:
  kind: gru
  hidden: 64
