<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>MIOBA Observatory</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1218; --panel:#181d26; --line:#2a3140; --fg:#e6e9ef; --dim:#8a93a6;
          --live:#3ddc84; --rec:#5aa9ff; --der:#f6c343; --warn:#ff9f43; --err:#ff5c5c; }
  * { box-sizing:border-box; }
  html, body { max-width:100%; overflow-x:hidden; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",Helvetica,Arial,sans-serif; }
  header { display:flex; align-items:center; gap:12px 18px; padding:8px 14px; border-bottom:1px solid var(--line); background:#131820; position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; letter-spacing:.04em; white-space:nowrap; }
  nav { display:flex; flex-wrap:wrap; gap:2px 12px; }
  nav a { color:var(--dim); text-decoration:none; padding:4px 2px; border-bottom:2px solid transparent; white-space:nowrap; }
  nav a.active { color:var(--fg); border-color:var(--live); }
  #exp { margin-left:auto; color:var(--dim); font-family:ui-monospace,Menlo,monospace; font-size:12px; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  #lang { color:var(--dim); font-size:11px; cursor:pointer; }
  main { padding:14px; max-width:1500px; margin:0 auto; }
  .grid { display:grid; gap:12px; min-width:0; }
  .g2 { grid-template-columns:repeat(2,minmax(0,1fr));} .g3{grid-template-columns:repeat(3,minmax(0,1fr));} .g4{grid-template-columns:repeat(4,minmax(0,1fr));}
  .g21 { grid-template-columns:2fr 1fr; }
  .workers { grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); }
  @media (max-width:1000px){ .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr));} .g21{grid-template-columns:1fr;} }
  @media (max-width:640px){ .g2,.g3,.g4,.workers{grid-template-columns:1fr;} main{padding:10px;} }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; min-width:0; }
  .panel h2 { margin:0 0 8px; font-size:13px; color:var(--dim); letter-spacing:.04em; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .kind { font-size:10px; padding:1px 6px; border-radius:10px; border:1px solid; letter-spacing:0; cursor:help; }
  .kind.LIVE{color:var(--live);border-color:var(--live);} .kind.RECORDED{color:var(--rec);border-color:var(--rec);} .kind.DERIVED{color:var(--der);border-color:var(--der);}
  .big { font-size:26px; font-weight:600; overflow-wrap:anywhere; }
  .kv { display:grid; grid-template-columns:auto minmax(0,1fr); gap:2px 14px; font-size:13px; }
  .kv div:nth-child(odd){ color:var(--dim); white-space:nowrap; }
  .kv div:nth-child(even){ overflow-wrap:anywhere; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--dim); font-weight:500; position:sticky; top:0; background:var(--panel); }
  .scroll { max-height:520px; overflow:auto; }
  .xscroll { overflow-x:auto; max-width:100%; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; }
  .id { cursor:pointer; color:var(--rec); }
  .id:hover { text-decoration:underline; }
  .pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; background:#232a37; }
  .st-running,.st-online,.st-SUCCEEDED{ color:var(--live);} .st-paused,.st-stopping,.st-lost,.st-UNKNOWN,.st-QUEUED{color:var(--warn);} .st-stopped,.st-offline,.st-error,.st-FAILED{color:var(--err);}
  .sev-warn{ color:var(--warn);} .sev-error{ color:var(--err);}
  canvas { width:100%; height:120px; display:block; max-width:100%; }
  .chart-title { font-size:12px; color:var(--dim); margin:6px 0 2px; }
  .legend span { margin-right:12px; font-size:11px; }
  .legend i { display:inline-block; width:10px; height:10px; margin-right:4px; border-radius:2px; vertical-align:middle;}
  .muted { color:var(--dim); }
  input, select { background:#0f141c; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:4px 6px; font-size:12px; max-width:100%; }
  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  .bar { height:6px; background:#0f141c; border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--rec); }
  .tree { font-family:ui-monospace,Menlo,monospace; font-size:12px; overflow-x:auto; }
  .tree div { padding:2px 0; white-space:nowrap; }
  #err { color:var(--err); font-size:12px; }
  .alerts { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .alert { border-left:4px solid var(--warn); background:#1f1a14; padding:8px 12px; border-radius:6px; font-size:13px; display:flex; gap:10px; flex-wrap:wrap; align-items:baseline; }
  .alert.error { border-color:var(--err); background:#231517; }
  .alert .ts { color:var(--dim); font-size:11px; white-space:nowrap; }
  .alert .ty { color:var(--dim); font-family:ui-monospace,Menlo,monospace; font-size:11px; }
  .gpu-title { font-size:15px; color:var(--fg); letter-spacing:0; }
  .gpu-sub { font-size:12px; color:var(--dim); font-family:ui-monospace,Menlo,monospace; }
  .ro { color:var(--dim); font-size:11px; white-space:nowrap; }
</style>
</head>

let LANG = localStorage.getItem('mioba.lang') || 'ja';
if (!I18N[LANG]) LANG = 'ja';
const T = () => I18N[LANG];
const t = (section, key) => (T()[section] && T()[section][key]) ?? (I18N.ja[section] && I18N.ja[section][key]) ?? key;
const tStatus = v => v == null ? t('misc','none') : (T().status[v] ?? v);
const tEvent = ty => T().event[ty] ?? ty;
const TZ = 'Asia/Tokyo';

// ---- formatting (internal values are UTC ISO8601 / bytes / seconds; display only) ----
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kind = k => k ? `<span class="kind ${esc(k)}" title="${esc(t('kindTip',k))} (${esc(k)})">${esc(t('kind',k))}</span>` : '';
const pill = v => v == null ? '' : `<span class="pill st-${esc(v)}" title="${esc(v)}">${esc(tStatus(v))}</span>`;
const short = id => id ? `<span class="mono id" onclick="location.hash='#/organism/${encodeURIComponent(id)}'" title="${esc(id)}">${esc(id.slice(0,18))}…</span>` : `<span class="muted">${t('misc','none')}</span>`;
const num = (v, d=1) => (v === null || v === undefined || Number.isNaN(Number(v))) ? t('misc','none') : Number(v).toFixed(d);
const DTF = new Intl.DateTimeFormat('ja-JP', { timeZone: TZ, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
const TF  = new Intl.DateTimeFormat('ja-JP', { timeZone: TZ, hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
const jst = (iso, withDate=true) => { const ms = typeof iso === 'number' ? iso : Date.parse(iso); if (!iso || Number.isNaN(ms)) return t('misc','none'); return (withDate ? DTF : TF).format(new Date(ms)) + ' JST'; };
const fmtTime = (iso, withDate=false) => iso ? `<span title="UTC ${esc(iso)}">${esc(jst(iso, withDate))}</span>` : `<span class="muted">${t('misc','none')}</span>`;
const fmtDateTime = iso => fmtTime(iso, true);
const fmtDur = s => { if (s == null || Number.isNaN(Number(s))) return t('misc','none'); s = Math.floor(Number(s)); const u = T().u;
  if (s < 60) return `${s}${u.sec}`; if (s < 3600) return `${Math.floor(s/60)}${u.min} ${s%60}${u.sec}`;
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60); return h >= 24 ? `${Math.floor(h/24)}${u.day} ${h%24}${u.hour} ${m}${u.min}` : `${h}${u.hour} ${m}${u.min} ${s%60}${u.sec}`; };
const fmtMs = ms => ms == null ? t('misc','none') : (ms >= 1000 ? `${num(ms/1000, 2)} ${T().u.sec}` : `${num(ms,0)} ms`);
const fmtBytes = b => { if (b == null || Number.isNaN(Number(b))) return t('misc','none'); b = Number(b); return b >= 1024**3 ? `${(b/1024**3).toFixed(1)} GB` : `${Math.round(b/1024**2)} MB`; };
const fmtMB = mb => mb == null ? t('misc','none') : fmtBytes(Number(mb) * 1024**2);
const fmtVram = (usedMb, totalMb) => usedMb == null && totalMb == null ? t('misc','none') : (totalMb != null && totalMb >= 1024 ? `${num((usedMb||0)/1024,1)} / ${num(totalMb/1024,1)} GB` : `${num(usedMb,0)} / ${num(totalMb,0)} MB`);
const fmtTemp = c => c == null ? t('misc','none') : `${num(c,0)} ℃`;
const fmtPct = p => p == null ? t('misc','none') : `${num(p,0)} %`;
const pj = s => { try { return typeof s === 'string' ? JSON.parse(s) : (s||{}); } catch { return {}; } };
async function api(p) { const r = await fetch(p); if (!r.ok) throw new Error(`${t('misc','fetchErr')}: ${p} → ${r.status}`); return r.json(); }
let timer = null;
function schedule(fn, ms) { clearTimeout(timer); timer = setTimeout(fn, ms); }
const eventRow = e => `<tr><td>${fmtTime(e.at)}</td><td>${esc(tEvent(e.type))}<div class="muted mono" style="font-size:10px">${esc(e.type)}</div></td><td class="sev-${esc(e.severity)}" title="${esc(e.severity)}">${esc(tStatus(e.severity))}</td><td class="mono">${esc(e.payload_json).slice(0,140)}</td></tr>`;
const alertsHtml = evs => { const rows = evs.filter(e => e.severity === 'warn' || e.severity === 'error').slice(-5).reverse();
  return `<div class="alerts">${rows.length ? rows.map(e => `<div class="alert ${esc(e.severity)}"><span class="ts">${esc(jst(e.at))}</span><b>${esc(tEvent(e.type))}</b><span class="ty">${esc(e.type)}</span><span class="mono muted" style="font-size:11px;overflow-wrap:anywhere">${esc(e.payload_json).slice(0,160)}</span></div>`).join('') : `<div class="muted" style="font-size:12px">${t('d','noAlerts')}</div>`}</div>`; };

// ---- tiny line chart --------------------------------------------------------
const COLORS = ['#5aa9ff','#3ddc84','#f6c343','#ff5c5c','#c86dd7','#4fd1c5','#ff9f43','#9fb3c8'];
function drawChart(canvas, series, opts={}) {
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth || 600, H = canvas.clientHeight || 120;
  canvas.width = W*dpr; canvas.height = H*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const all = series.flatMap(s => s.points);
  if (!all.length) { ctx.fillStyle='#8a93a6'; ctx.font='12px sans-serif'; ctx.fillText(t('t','nodata'), 8, H/2); return; }
  const t0 = opts.t0 ?? Math.min(...all.map(p=>p.t)), t1 = opts.t1 ?? Math.max(...all.map(p=>p.t));
  let y0 = opts.y0 ?? Math.min(...all.map(p=>p.v)), y1 = opts.y1 ?? Math.max(...all.map(p=>p.v));
  if (y1 === y0) { y1 = y0 + 1; }
  const pad = {l:38, r:6, t:6, b:16};
  const X = tt => pad.l + (tt - t0) / Math.max(1, t1 - t0) * (W - pad.l - pad.r);
  const Y = v => H - pad.b - (v - y0) / (y1 - y0) * (H - pad.t - pad.b);
  ctx.strokeStyle = '#2a3140'; ctx.lineWidth = 1;
  for (let i=0;i<=3;i++){ const y = pad.t + i*(H-pad.t-pad.b)/3; ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
    ctx.fillStyle='#8a93a6'; ctx.font='10px sans-serif'; ctx.fillText(num(y1 - i*(y1-y0)/3, 1), 2, y+3); }
  ctx.fillStyle='#8a93a6'; ctx.fillText(TF.format(new Date(t0)), pad.l, H-3); ctx.fillText(TF.format(new Date(t1)), W-pad.r-50, H-3);
  (opts.marks||[]).forEach(m => { ctx.strokeStyle = m.color || '#ff9f43'; ctx.setLineDash([2,3]); ctx.beginPath(); ctx.moveTo(X(m.t),pad.t); ctx.lineTo(X(m.t),H-pad.b); ctx.stroke(); ctx.setLineDash([]); });
  series.forEach((s,i) => {
    ctx.strokeStyle = s.color || COLORS[i%COLORS.length]; ctx.lineWidth = 1.5; ctx.beginPath();
    s.points.forEach((p,j) => j ? ctx.lineTo(X(p.t),Y(p.v)) : ctx.moveTo(X(p.t),Y(p.v)));
    ctx.stroke();
  });
}

  const firstAt = [...Object.values(d.telemetry).flat(), ...Object.values(d.worker_heartbeats).flat()].reduce((m, r) => Math.min(m, Date.parse(r.at)), t1);
  const t0 = Math.max(Date.parse(d.since), firstAt - 5000);
  const evMarks = d.events.filter(e => e.severity !== 'info' || /paused|resumed|worker|stopped|started/.test(e.type)).map(e => ({t: Date.parse(e.at), color: e.severity==='info' ? '#5aa9ff' : e.severity==='warn' ? '#ff9f43' : '#ff5c5c'}));
  const groups = {};
  Object.entries(d.telemetry).forEach(([k, rows]) => { const [src, sig] = k.split('|'); (groups[sig] ||= []).push({name: src, points: pts(rows, 'value')}); });
  const workerIds = Object.keys(d.worker_heartbeats);
  const wSeries = key => workerIds.map(w => ({name: w, points: pts(d.worker_heartbeats[w], key)}));
  const sigs = Object.keys(groups).sort();
  $('#main').innerHTML = `
    <div class="toolbar">${t('t','window')} <select id="mins">${[5,30,120,720,1440].map(m => `<option ${m===mins?'selected':''} value="${m}">${fmtDur(m*60)}</option>`).join('')}</select>
      <span class="muted">${kind(d.kind)} ${t('t','src')}</span>
      <span class="muted">${t('t','experiment')}: <b class="st-${esc(d.status.status)}" title="${esc(d.status.status)}">${esc(tStatus(d.status.status))}</b> ${kind('LIVE')}</span></div>
    <div class="grid g2">
      <div class="panel"><h2>${t('t','temp')} ${kind('RECORDED')}</h2><canvas id="c_temp"></canvas>${legend(wSeries('temperature_c'))}</div>
      <div class="panel"><h2>${t('t','util')} ${kind('RECORDED')}</h2><canvas id="c_util"></canvas>${legend(wSeries('utilization_pct'))}</div>
      <div class="panel"><h2>${t('t','vram')} ${kind('RECORDED')}</h2><canvas id="c_vram"></canvas>${legend(wSeries('vram_used_mb'))}</div>
      ${sigs.map((s,i) => `<div class="panel"><h2>${esc(s)} <span class="muted">(${esc(groups[s][0]?.points.length ? d.telemetry[Object.keys(d.telemetry).find(k=>k.endsWith('|'+s))][0].domain : '')})</span> ${kind('RECORDED')}</h2><canvas id="c_s${i}"></canvas>${legend(groups[s])}</div>`).join('')}
    </div>
    <div class="panel" style="margin-top:12px"><h2>${t('t','stream')} ${kind('RECORDED')}</h2>
      <div class="scroll xscroll" style="max-height:300px"><table><thead><tr><th>${t('t','time')}</th><th>${t('t','kind')}</th><th>${t('t','signal')}</th><th>${t('t','source')}</th><th>${t('t','value')}</th></tr></thead><tbody>
      ${[...d.events.map(e => ({at:e.at, k:'event', type:e.type, label:tEvent(e.type), src:e.source, val:e.payload_json, sev:e.severity})),
         ...Object.entries(d.telemetry).flatMap(([k, rows]) => rows.slice(-5).map(r => ({at:r.at, k:'sensor', type:k.split('|')[1], label:k.split('|')[1], src:k.split('|')[0], val:num(r.value,3), sev:'info'})))]
        .sort((a,b) => b.at.localeCompare(a.at)).slice(0,200).map(r => `<tr><td>${fmtTime(r.at)}</td><td>${esc(t('t', r.k))}</td><td class="sev-${esc(r.sev)}">${esc(r.label)}${r.k==='event' ? `<div class="muted mono" style="font-size:10px">${esc(r.type)}</div>` : ''}</td><td class="mono">${esc(r.src)}</td><td class="mono">${esc(String(r.val)).slice(0,120)}</td></tr>`).join('') || `<tr><td colspan="5" class="muted">${t('t','nodata')}</td></tr>`}
      </tbody></table></div></div>`;
  $('#mins').addEventListener('change', e => { sessionStorage.setItem('mioba.minutes', e.target.value); telemetry(); });
  const o = {t0, t1, marks: evMarks};
  drawChart($('#c_temp'), wSeries('temperature_c'), {...o, y0:0, y1:100});
  drawChart($('#c_util'), wSeries('utilization_pct'), {...o, y0:0, y1:100});
  drawChart($('#c_vram'), wSeries('vram_used_mb'), {...o, y0:0});
  sigs.forEach((s,i) => drawChart($(`#c_s${i}`), groups[s], o));
  schedule(telemetry, 5000);
}

// ---- Events timeline --------------------------------------------------------
async function events() {
  const type = sessionStorage.getItem('mioba.evtype') || '';
  const d = await api(`/api/events?since_id=0&limit=100000${type ? '&type='+encodeURIComponent(type) : ''}`);
  const rows = d.events.slice().reverse();
  const all = await api('/api/events?since_id=0&limit=100000');
  const types = [...new Set(all.events.map(e => e.type))].sort();
  $('#main').innerHTML = `
    ${alertsHtml(all.events)}
    <div class="toolbar">${t('e','type')} <select id="ty"><option value="">${t('e','all')}</option>${types.map(ty => `<option value="${esc(ty)}" ${ty===type?'selected':''}>${esc(tEvent(ty))} (${esc(ty)})</option>`).join('')}</select>
      <span class="muted">${rows.length} ${t('e','count')} ${kind(d.kind)}</span></div>
    <div class="panel scroll xscroll" style="max-height:80vh"><table><thead><tr><th>${t('e','n')}</th><th>${t('e','time')}</th><th>${t('e','message')}</th><th>${t('e','severity')}</th><th>${t('e','source')}</th><th>${t('e','payload')}</th></tr></thead><tbody>
      ${rows.map(e => `<tr><td class="muted">${e.event_id}</td><td>${fmtDateTime(e.at)}</td><td>${esc(tEvent(e.type))}<div class="muted mono" style="font-size:10px">${esc(e.type)}</div></td><td class="sev-${esc(e.severity)}" title="${esc(e.severity)}">${esc(tStatus(e.severity))}</td><td>${esc(e.source)}</td><td class="mono">${esc(e.payload_json)}</td></tr>`).join('')}
    </tbody></table></div>`;
  $('#ty').addEventListener('change', e => { sessionStorage.setItem('mioba.evtype', e.target.value); events(); });
  schedule(events, 5000);
}
</script>
</body>
</html>
