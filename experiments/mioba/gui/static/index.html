<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>MIOBA Observatory</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1218; --panel:#181d26; --line:#2a3140; --fg:#e6e9ef; --dim:#8a93a6;
          --live:#3ddc84; --rec:#5aa9ff; --der:#f6c343; --warn:#ff9f43; --err:#ff5c5c; }
  * { box-sizing:border-box; }
  html, body { max-width:100%; overflow-x:hidden; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",Helvetica,Arial,sans-serif; }
  header { display:flex; align-items:center; gap:12px 18px; padding:8px 14px; border-bottom:1px solid var(--line); background:#131820; position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; letter-spacing:.04em; white-space:nowrap; }
  nav { display:flex; flex-wrap:wrap; gap:2px 12px; }
  nav a { color:var(--dim); text-decoration:none; padding:4px 2px; border-bottom:2px solid transparent; white-space:nowrap; }
  nav a.active { color:var(--fg); border-color:var(--live); }
  #exp { margin-left:auto; color:var(--dim); font-family:ui-monospace,Menlo,monospace; font-size:12px; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  #lang { color:var(--dim); font-size:11px; cursor:pointer; }
  main { padding:14px; max-width:1500px; margin:0 auto; }
  .grid { display:grid; gap:12px; min-width:0; }
  .g2 { grid-template-columns:repeat(2,minmax(0,1fr));} .g3{grid-template-columns:repeat(3,minmax(0,1fr));} .g4{grid-template-columns:repeat(4,minmax(0,1fr));}
  .g21 { grid-template-columns:2fr 1fr; }
  .workers { grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); }
  @media (max-width:1000px){ .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr));} .g21{grid-template-columns:1fr;} }
  @media (max-width:640px){ .g2,.g3,.g4,.workers{grid-template-columns:1fr;} main{padding:10px;} }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; min-width:0; }
  .panel h2 { margin:0 0 8px; font-size:13px; color:var(--dim); letter-spacing:.04em; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .kind { font-size:10px; padding:1px 6px; border-radius:10px; border:1px solid; letter-spacing:0; cursor:help; }
  .kind.LIVE{color:var(--live);border-color:var(--live);} .kind.RECORDED{color:var(--rec);border-color:var(--rec);} .kind.DERIVED{color:var(--der);border-color:var(--der);}
  .big { font-size:26px; font-weight:600; overflow-wrap:anywhere; }
  .kv { display:grid; grid-template-columns:auto minmax(0,1fr); gap:2px 14px; font-size:13px; }
  .kv div:nth-child(odd){ color:var(--dim); white-space:nowrap; }
  .kv div:nth-child(even){ overflow-wrap:anywhere; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--dim); font-weight:500; position:sticky; top:0; background:var(--panel); }
  .scroll { max-height:520px; overflow:auto; }
  .xscroll { overflow-x:auto; max-width:100%; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; }
  .id { cursor:pointer; color:var(--rec); }
  .id:hover { text-decoration:underline; }
  .pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; background:#232a37; }
  .st-running,.st-online,.st-SUCCEEDED{ color:var(--live);} .st-paused,.st-stopping,.st-lost,.st-UNKNOWN,.st-QUEUED{color:var(--warn);} .st-stopped,.st-offline,.st-error,.st-FAILED{color:var(--err);}
  .sev-warn{ color:var(--warn);} .sev-error{ color:var(--err);}
  canvas { width:100%; height:120px; display:block; max-width:100%; }
  .chart-title { font-size:12px; color:var(--dim); margin:6px 0 2px; }
  .legend span { margin-right:12px; font-size:11px; }
  .legend i { display:inline-block; width:10px; height:10px; margin-right:4px; border-radius:2px; vertical-align:middle;}
  .muted { color:var(--dim); }
  input, select { background:#0f141c; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:4px 6px; font-size:12px; max-width:100%; }
  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  .bar { height:6px; background:#0f141c; border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--rec); }
  .tree { font-family:ui-monospace,Menlo,monospace; font-size:12px; overflow-x:auto; }
  .tree div { padding:2px 0; white-space:nowrap; }
  #err { color:var(--err); font-size:12px; }
  .alerts { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .alert { border-left:4px solid var(--warn); background:#1f1a14; padding:8px 12px; border-radius:6px; font-size:13px; display:flex; gap:10px; flex-wrap:wrap; align-items:baseline; }
  .alert.error { border-color:var(--err); background:#231517; }
  .alert .ts { color:var(--dim); font-size:11px; white-space:nowrap; }
  .alert .ty { color:var(--dim); font-family:ui-monospace,Menlo,monospace; font-size:11px; }
  .gpu-title { font-size:15px; color:var(--fg); letter-spacing:0; }
  .gpu-sub { font-size:12px; color:var(--dim); font-family:ui-monospace,Menlo,monospace; }
  .ro { color:var(--dim); font-size:11px; white-space:nowrap; }
  .terr { width:100%; height:340px; display:block; background:#10151d; border-radius:6px; }
  .terr circle.sel { cursor:pointer; }
  @keyframes blip { 0%,100%{opacity:.25} 50%{opacity:1} }
  .blink { animation:blip 1.1s ease-in-out infinite; }
  .feed { max-height:420px; overflow:auto; font-size:12.5px; }
  .feed .row { display:flex; gap:8px; padding:3px 0; border-bottom:1px solid #212836; align-items:baseline; }
  .feed .row .ts { color:var(--dim); font-size:11px; white-space:nowrap; font-family:ui-monospace,Menlo,monospace; }
  .feed .hl { color:#0f1218; background:var(--der); border-radius:3px; padding:0 6px; font-size:10px; font-weight:600; letter-spacing:.04em; white-space:nowrap; }
  .feed .hl.organ { background:var(--live); } .feed .hl.rec { background:var(--rec); } .feed .hl.warn { background:var(--warn); }
  .note { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:3px 10px; font-size:12.5px; align-items:baseline; }
  .note .lb { color:var(--dim); white-space:nowrap; }
  .hist { display:flex; align-items:flex-end; gap:3px; height:64px; }
  .hist i { flex:1; background:var(--rec); border-radius:2px 2px 0 0; min-height:1px; display:block; }
  .rbar { display:grid; grid-template-columns:110px minmax(0,1fr) auto; gap:4px 8px; font-size:12px; align-items:center; }
  .rbar b { font-weight:400; color:var(--dim); overflow:hidden; text-overflow:ellipsis; }
  .spark { display:flex; align-items:flex-end; gap:1px; height:44px; }
  .spark i { flex:1; display:block; background:var(--live); min-height:1px; }
  .spark i.d { background:var(--warn); }
  .neural-panel { margin-top:12px; }
  .neural-layout { display:grid; grid-template-columns:minmax(0,3fr) minmax(240px,2fr); gap:16px; }
  .neural-grid { height:300px; background:#0f141c; border-radius:6px; }
  .neural-state { display:flex; align-items:center; gap:7px; }
  .neural-dot { width:8px; height:8px; border-radius:50%; background:var(--dim); display:inline-block; }
  .neural-dot.is-live { background:var(--live); box-shadow:0 0 7px #3ddc8460; }
  .neural-history { height:64px; display:flex; align-items:flex-end; gap:2px; background:#0f141c; padding:5px; border-radius:4px; }
  .neural-history i { flex:1; display:block; background:var(--rec); min-height:1px; max-width:18px; }
  .neural-history.is-recorded i { background:#657386; }
  .neural-brain { height:340px; background:#0f141c; border-radius:6px; }
  .neural-note { color:var(--dim); font-size:12px; margin-top:8px; overflow-wrap:anywhere; }
  .neural-meta { font-size:12px; }
  @media (max-width:700px) { .neural-layout { grid-template-columns:1fr; } .neural-grid { height:280px; } }
</style>
</head>

function drawChart(canvas, series, opts={}) {

  if (!all.length) { ctx.fillStyle='#8a93a6'; ctx.font='12px sans-serif'; ctx.fillText(t('t','nodata'), 8, H/2); return; }
  const t0 = opts.t0 ?? Math.min(...all.map(p=>p.t)), t1 = opts.t1 ?? Math.max(...all.map(p=>p.t));
  let y0 = opts.y0 ?? Math.min(...all.map(p=>p.v)), y1 = opts.y1 ?? Math.max(...all.map(p=>p.v));
  if (y1 === y0) { y1 = y0 + 1; }

  const X = tt => pad.l + (tt - t0) / Math.max(1, t1 - t0) * (W - pad.l - pad.r);
  const Y = v => H - pad.b - (v - y0) / (y1 - y0) * (H - pad.t - pad.b);
  ctx.strokeStyle = '#2a3140'; ctx.lineWidth = 1;

}

const NEURAL_POLL_MS = 750, NEURAL_HISTORY_LIMIT = 48;
const neuralInteger = value => Number.isSafeInteger(value) && value >= 0;
const neuralId = value => typeof value === 'string' && value.length > 0 && value.length <= 256;
function validNeuralFrame(f, envelope) {
  if (!f || f.schema_version !== 1 || f.experiment_id !== envelope.experiment_id || f.genome_id !== envelope.genome_id ||
      !neuralId(f.job_id) || !neuralId(f.worker_id) || !neuralInteger(f.attempt) || !neuralInteger(f.sequence) ||
      !neuralInteger(f.evaluation_pass) || f.evaluation_pass > 64 || !['torch','mock'].includes(f.backend) || f.phase !== 'evaluation' ||
      !neuralInteger(f.replicate_index) || !Number.isInteger(f.replicate_seed) || f.replicate_seed < 0 || !neuralInteger(f.n_neurons) || f.n_neurons < 1 ||
      !neuralInteger(f.n_base) || f.n_base > f.n_neurons || !Number.isFinite(f.window_start_ms) || f.window_start_ms < 0 ||
      !Number.isFinite(f.window_end_ms) || f.window_end_ms <= f.window_start_ms || !neuralInteger(f.received_at_unix_ms) || f.received_at_unix_ms < 1 ||
      !Array.isArray(f.neuron_indices) || !Array.isArray(f.spike_counts) || f.neuron_indices.length < 1 || f.neuron_indices.length > 512 ||
      f.neuron_indices.length !== f.spike_counts.length) return false;
  return f.neuron_indices.every((index,i) => neuralInteger(index) && index < f.n_neurons && (i === 0 || index > f.neuron_indices[i-1])) &&
    f.spike_counts.every(neuralInteger);
}
class NeuralActivityState {
  constructor(genomeId, experimentId=null) {
    this.genomeId = genomeId; this.experimentId = experimentId;
    this.frame = null; this.history = []; this.sessionKey = null; this.sequence = -1;
    this.sourceKind = 'UNAVAILABLE'; this.sourceStatus = 'waiting'; this.jobStatus = null;
    this.ttlMs = 5000; this.ageBase = null; this.ageAt = 0; this.lastObserved = 0; this.failed = false;
  }
  age(now) { return this.ageBase == null ? null : this.ageBase + Math.max(0, now - this.ageAt); }
  accept(p, now=performance.now(), transitMs=0) {
    if (!p || p.schema_version !== 1 || p.genome_id !== this.genomeId || !neuralId(p.experiment_id) ||
        (this.experimentId != null && p.experiment_id !== this.experimentId) || !['LIVE','RECORDED','UNAVAILABLE'].includes(p.kind) ||
        !['running','stale','recorded','waiting','unavailable'].includes(p.status) || p.ttl_ms !== 5000 ||

    organs.forEach(o => { const p = organAnchor(o.organ_id); if (p) { ctx.fillStyle = 'rgba(255,159,67,0.8)'; ctx.fillRect(p[0]-2, p[1]-2, 4, 4); } });
    ctx.strokeStyle = 'rgba(255,159,67,0.35)'; ctx.lineWidth = 1;
    atts.forEach(a => {
      const s = endpoint(a.source), tg = endpoint(a.target);
      if (!s || !tg) return;
      ctx.beginPath(); ctx.moveTo(s[0], s[1]); ctx.lineTo(tg[0], tg[1]); ctx.stroke();
      ctx.fillStyle = 'rgba(255,159,67,0.9)';
      ctx.beginPath(); ctx.arc(tg[0], tg[1], 2.2, 0, 2*Math.PI); ctx.fill();
      if ((a.direction || '') === 'bidirectional') { ctx.beginPath(); ctx.arc(s[0], s[1], 2.2, 0, 2*Math.PI); ctx.fill(); }
    });
  }
  if (!frame) { ctx.fillStyle='#8a93a6'; ctx.font='12px sans-serif'; ctx.fillText(t('n','waiting'),12,H/2); canvas.brainCells = []; return; }
  const maxCount = Math.max(1,...frame.spike_counts);
  canvas.brainCells = frame.neuron_indices.map((index,i) => ({index, count:frame.spike_counts[i], ...brainPoint(index, frame.n_base, W, H)}));
  canvas.brainCells.forEach(cell => {
    const on = cell.count > 0, intensity = .35 + .65*Math.log1p(cell.count)/Math.log1p(maxCount);
    ctx.fillStyle = !on ? 'rgba(52,61,75,0.7)' : `rgba(${cell.artificial ? '255,159,67' : '90,169,255'},${intensity})`;
    ctx.beginPath(); ctx.arc(cell.x, cell.y, on ? 2.6 : 1.3, 0, 2*Math.PI); ctx.fill();
  });
}
function renderNeuralActivity(state, now=performance.now()) {
  const panel = $('#neural-activity');
  if (!panel || panel.dataset.genomeId !== state.genomeId) return;
  const view = state.view(now), f = view.frame;
  $('#neural-kind').innerHTML = kind(view.kind);
  $('#neural-dot').className = `neural-dot${view.live ? ' is-live' : ''}`;
  $('#neural-status').textContent = t('n',view.status);
  $('#neural-backend').textContent = f ? (f.backend === 'mock' ? t('n','mock') : f.backend) : '';
  $('#neural-note').textContent = view.failed ? t('n','failure') : f && !view.live ? t('n','frozen') : '';
  const rows = [[t('d','id'),state.experimentId],[t('p','genome'),state.genomeId]];
  if (f) rows.push(
    [t('n','sample'),`${f.neuron_indices.length} / ${f.n_neurons}`],
    [t('n','replicate'),f.replicate_index],
    [t('n','realTime'),jst(f.received_at_unix_ms,true)],
    [t('n','simTime'),`${num(f.window_end_ms,2)} ms`],
    [t('n','window'),`${num(f.window_start_ms,2)}–${num(f.window_end_ms,2)} ms (${num(f.window_end_ms-f.window_start_ms,2)} ms)`],
    [t('n','age'),view.age == null ? t('misc','none') : fmtMs(view.age)],
    [t('n','pass'),`${f.evaluation_pass} / ${f.attempt}`], [t('n','sequence'),f.sequence],
    [t('n','job'),`${f.job_id} / ${f.worker_id}`], [t('n','spikes'),f.spike_counts.reduce((a,b)=>a+b,0)],
    [t('n','active'),fmtPct(100*f.spike_counts.filter(count=>count>0).length/f.spike_counts.length)]);
  $('#neural-meta').innerHTML = rows.map(([label,value])=>`<div>${esc(label)}</div><div>${esc(value ?? t('misc','none'))}</div>`).join('');
  const key = JSON.stringify([state.sessionKey,state.sequence,view.live,LANG]);
  if (panel.dataset.frameKey !== key) {
    panel.dataset.frameKey = key;
    drawNeuralGrid($('#neural-grid'),f);
    drawNeuralBrain($('#neural-brain'),f);
    $('#neural-history').className = `neural-history${view.live ? '' : ' is-recorded'}`;
    $('#neural-history').innerHTML = view.history.length ? view.history.map(h => `<i style="height:${Math.max(2,100*h.active)}%" title="${esc(`${h.start}–${h.end} ms · ${t('n','active')} ${fmtPct(h.active*100)} · #${h.sequence}`)}"></i>`).join('') : `<span class="muted">${t('n','historyEmpty')}</span>`;
  }
}
function watchNeuralActivity(id, generation, experimentId=null) {
  const state = new NeuralActivityState(id,experimentId);
  let stopped = false, pollTimer = null, clockTimer = null, request = null;
  const active = () => !stopped && currentRoute(generation) && $('#neural-activity')?.dataset.genomeId === id;
  const render = () => { if (active()) renderNeuralActivity(state); };
  const tick = () => { if (!active()) return; render(); clockTimer = setTimeout(tick,250); };
  const poll = async () => {
    if (!active()) return;
    if (document.hidden) { pollTimer = setTimeout(poll,NEURAL_POLL_MS); return; }
    const controller = new AbortController(); request = controller;
    const signal = routeController.signal, cancel = () => controller.abort();
    signal.addEventListener('abort',cancel,{once:true});
    const timeout = setTimeout(cancel,3000), started = performance.now();
    try {
      const payload = await api(`/api/gui/individual/${encodeURIComponent(id)}/neural-activity`,generation,controller.signal);
      if (!active()) return;
      state.accept(payload,performance.now(),performance.now()-started); render();
    } catch (error) {
      if (active()) { state.fail(); render(); }
    } finally {
      clearTimeout(timeout); signal.removeEventListener('abort',cancel); request = null;
      if (active()) pollTimer = setTimeout(poll,NEURAL_POLL_MS);
    }
  };
  const canvas = $('#neural-grid');
  canvas.addEventListener('pointermove',event => {
    const rect = canvas.getBoundingClientRect(), x = event.clientX-rect.left, y = event.clientY-rect.top;
    const cell = (canvas.neuralCells || []).find(cell=>x>=cell.x && x<cell.x+cell.w && y>=cell.y && y<cell.y+cell.h);
    canvas.title = cell ? `${t('n','neuron')} ${cell.index} · ${t('n','count')} ${cell.count}` : '';
  });
  const brain = $('#neural-brain');
  brain.addEventListener('pointermove',event => {
    const rect = brain.getBoundingClientRect(), x = event.clientX-rect.left, y = event.clientY-rect.top;
    const cell = (brain.brainCells || []).find(c => (x-c.x)**2 + (y-c.y)**2 < 36);
    brain.title = cell ? `${t('n','neuron')} ${cell.index} · ${cell.region} · ${t('n','count')} ${cell.count}` : '';
  });
  const resize = () => { if (active()) { delete $('#neural-activity').dataset.frameKey; render(); } };
  window.addEventListener('resize',resize);
  tick(); poll();
  return () => { stopped = true; clearTimeout(pollTimer); clearTimeout(clockTimer); request?.abort(); window.removeEventListener('resize',resize); };
}

        <div class="kv" style="margin-top:8px"><div>${t('o','devRules')}</div><div>${(doc.development_rules||[]).length}</div><div>${t('o','plastRules')}</div><div>${(doc.plasticity_rules||[]).length}</div></div></div>

// ---- MIE / Telemetry --------------------------------------------------------
async function telemetry() {
  const mins = Number(sessionStorage.getItem('mioba.minutes') || 30);
  const d = await api(`/api/gui/telemetry?minutes=${mins}`);
  const t1 = Date.now();
  const firstAt = [...Object.values(d.telemetry).flat(), ...Object.values(d.worker_heartbeats).flat()].reduce((m, r) => Math.min(m, Date.parse(r.at)), t1);
  const t0 = Math.max(Date.parse(d.since), firstAt - 5000);
  const evMarks = d.events.filter(e => e.severity !== 'info' || /paused|resumed|worker|stopped|started/.test(e.type)).map(e => ({t: Date.parse(e.at), color: e.severity==='info' ? '#5aa9ff' : e.severity==='warn' ? '#ff9f43' : '#ff5c5c'}));
  const groups = {};
  Object.entries(d.telemetry).forEach(([k, rows]) => { const [src, sig] = k.split('|'); (groups[sig] ||= []).push({name: src, points: pts(rows, 'value')}); });
  const workerIds = Object.keys(d.worker_heartbeats);
  const wSeries = key => workerIds.map(w => ({name: w, points: pts(d.worker_heartbeats[w], key)}));
  const sigs = Object.keys(groups).sort();
  $('#main').innerHTML = `
    <div class="toolbar">${t('t','window')} <select id="mins">${[5,30,120,720,1440].map(m => `<option ${m===mins?'selected':''} value="${m}">${fmtDur(m*60)}</option>`).join('')}</select>
      <span class="muted">${kind(d.kind)} ${t('t','src')}</span>
      <span class="muted">${t('t','experiment')}: <b class="st-${esc(d.status.status)}" title="${esc(d.status.status)}">${esc(tStatus(d.status.status))}</b> ${kind('LIVE')}</span></div>
    <div class="grid g2">
      <div class="panel"><h2>${t('t','temp')} ${kind('RECORDED')}</h2><canvas id="c_temp"></canvas>${legend(wSeries('temperature_c'))}</div>
      <div class="panel"><h2>${t('t','util')} ${kind('RECORDED')}</h2><canvas id="c_util"></canvas>${legend(wSeries('utilization_pct'))}</div>
      <div class="panel"><h2>${t('t','vram')} ${kind('RECORDED')}</h2><canvas id="c_vram"></canvas>${legend(wSeries('vram_used_mb'))}</div>
      ${sigs.map((s,i) => `<div class="panel"><h2>${esc(tSignal(s))} <span class="muted mono">${esc(s)} (${esc(groups[s][0]?.points.length ? d.telemetry[Object.keys(d.telemetry).find(k=>k.endsWith('|'+s))][0].domain : '')})</span> ${kind('RECORDED')}</h2><canvas id="c_s${i}"></canvas>${legend(groups[s])}</div>`).join('')}
    </div>
    <div class="panel" style="margin-top:12px"><h2>${t('t','stream')} ${kind('RECORDED')}</h2>
      <div class="scroll xscroll" style="max-height:300px"><table><thead><tr><th>${t('t','time')}</th><th>${t('t','kind')}</th><th>${t('t','signal')}</th><th>${t('t','source')}</th><th>${t('t','value')}</th></tr></thead><tbody>
      ${[...d.events.map(e => ({at:e.at, k:'event', type:e.type, label:tEvent(e.type), src:e.source, val:e.payload_json, sev:e.severity})),
         ...Object.entries(d.telemetry).flatMap(([k, rows]) => rows.slice(-5).map(r => ({at:r.at, k:'sensor', type:k.split('|')[1], label:tSignal(k.split('|')[1]), src:k.split('|')[0], val:num(r.value,3), sev:'info'})))]
        .sort((a,b) => b.at.localeCompare(a.at)).slice(0,200).map(r => `<tr><td>${fmtTime(r.at)}</td><td>${esc(t('t', r.k))}</td><td class="sev-${esc(r.sev)}">${esc(r.label)}${r.label !== r.type ? `<div class="muted mono" style="font-size:10px">${esc(r.type)}</div>` : ''}</td><td class="mono">${esc(r.src)}</td><td class="mono">${esc(String(r.val)).slice(0,120)}</td></tr>`).join('') || `<tr><td colspan="5" class="muted">${t('t','nodata')}</td></tr>`}
      </tbody></table></div></div>`;
  $('#mins').addEventListener('change', e => { sessionStorage.setItem('mioba.minutes', e.target.value); telemetry(); });
  const o = {t0, t1, marks: evMarks};
  drawChart($('#c_temp'), wSeries('temperature_c'), {...o, y0:0, y1:100});
  drawChart($('#c_util'), wSeries('utilization_pct'), {...o, y0:0, y1:100});
  drawChart($('#c_vram'), wSeries('vram_used_mb'), {...o, y0:0});
  sigs.forEach((s,i) => drawChart($(`#c_s${i}`), groups[s], o));
  schedule(telemetry, 5000);
}
