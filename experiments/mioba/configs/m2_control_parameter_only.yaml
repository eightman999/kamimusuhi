# M2 control lineage — parameter-only (M2 §19).
#
# Same selection pressure as m2_functional_departure (departure is
# measured and rewarded), but the mutation pool is restricted to
# SCALE_PARAMETER: the lineage cannot change its structure at all.
# Comparing it against the departure arm separates "the genome changed"
# from "the genome changed its *wiring*".
#
# evolution.mutation.weights is replaced wholesale (see
# genome/mutation.merged_config), so {parameter: 1.0} removes every
# structural and prune operator from the draw.
experiment: {id_prefix: "M2P", runs_dir: "experiments/mioba/.runs"}
population: {target_size: 8}
evolution:
  max_generations: 4
  elite_k: 2
  mutation_seed: 4242
  mutation:
    weights: {parameter: 1.0}
worker: {execution_batch: 4, candidates: [1,2,4], vram_headroom: 0.85, bench_duration_ms: 100, heartbeat_s: 2, lost_after_s: 15, grace_s: 10}
jobs: {requeue_unknown: true, max_attempts: 3}
evaluation: {tier: standard, replicates: 4, duration_ms: 200, backend: mock, environment_id: synthetic-quiet-v0, target_rate_hz: 5.0}
fba: {data_dir: null, synthetic: true, synthetic_neurons: 2000}
checkpoint: {interval_s: 30}
stop: {timeout_s: 30}
mie: {interval_s: 1, collectors: [cpu, ram], anomaly: {gpu_temp_c: 85}}
env: {stim_fraction: 0.01, stim_rate_hz: 50}
traces: {store_full_for: [elite, novel, debug, explicit], dir: traces}
gui: {enabled: false}
functional_departure:
  enabled: true
  substrate_id: fba0
  severities: [0.1, 0.25, 0.5]
  controls: {founder: true, sham: true}
fitness:
  weights:
    # identical selection pressure to the departure arm — only the
    # mutation pool differs
    departure_resistance: 0.3
