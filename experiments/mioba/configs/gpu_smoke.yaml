# Two-GPU (RTX 3060 + P100) smoke config: torch backend, synthetic FBA,
# small population, one generation. Used by the "Human GPU validation"
# section of the README. Not a long-run config.
experiment: {id_prefix: "GS", runs_dir: "experiments/mioba/.runs"}
population: {target_size: 8}
evolution: {max_generations: 1, elite_k: 2, mutation_seed: 4242}
worker: {batch_size: auto, candidates: [1,2,4,8,16,32], heartbeat_s: 2, lost_after_s: 20, grace_s: 10}
jobs: {requeue_unknown: true, max_attempts: 3}
evaluation: {tier: smoke, duration_ms: 500, backend: torch, environment_id: synthetic-quiet-v0, target_rate_hz: 5.0}
fba: {data_dir: null, synthetic: true, synthetic_neurons: 20000}
checkpoint: {interval_s: 30}
stop: {timeout_s: 60}
mie: {interval_s: 2, collectors: [gpu, cpu, ram], anomaly: {gpu_temp_c: 85}}
env: {stim_fraction: 0.01, stim_rate_hz: 50}
traces: {store_full_for: [elite, novel, debug, explicit], dir: traces}
gui: {enabled: true}
