# M2 smoke: the substrate-independent organism path exercised end to
# end — schema v4 substrate genes, the registry-driven phenotype, and
# the functional-departure battery, all on the mock backend.
experiment: {id_prefix: "S2", runs_dir: "experiments/mioba/.runs"}
population: {target_size: 4}
evolution: {max_generations: 1, elite_k: 2, mutation_seed: 99}
worker: {execution_batch: 2, candidates: [1,2], vram_headroom: 0.85, bench_duration_ms: 50, heartbeat_s: 1, lost_after_s: 8, grace_s: 5}
jobs: {requeue_unknown: true, max_attempts: 3}
evaluation: {tier: smoke, replicates: 4, duration_ms: 100, backend: mock, environment_id: synthetic-quiet-v0, target_rate_hz: 5.0}
fba: {data_dir: null, synthetic: true, synthetic_neurons: 500}
checkpoint: {interval_s: 5}
stop: {timeout_s: 10}
mie: {interval_s: 1, collectors: [cpu, ram], anomaly: {gpu_temp_c: 85}}
env: {stim_fraction: 0.01, stim_rate_hz: 50}
traces: {store_full_for: [elite, novel, debug, explicit], dir: traces}
gui: {enabled: false}
# M2 §16-18: measure what the individual uses, not just whether it works
functional_departure:
  enabled: true
  substrate_id: fba0
  severities: [0.1, 0.25]
  controls: {founder: true, sham: true}
