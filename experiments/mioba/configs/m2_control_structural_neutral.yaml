# M2 control lineage — structural-neutral (M2 §19).
#
# The mutation pool is unchanged (structure can grow), the departure
# battery still runs so the raw metrics exist, but selection never sees
# it: departure_resistance weight is 0. Comparing this arm against
# m2_functional_departure separates "structure happened to drift" from
# "structure was selected to reduce substrate dependence".
experiment: {id_prefix: "M2N", runs_dir: "experiments/mioba/.runs"}
population: {target_size: 8}
evolution: {max_generations: 4, elite_k: 2, mutation_seed: 4242}
worker: {execution_batch: 4, candidates: [1,2,4], vram_headroom: 0.85, bench_duration_ms: 100, heartbeat_s: 2, lost_after_s: 15, grace_s: 10}
jobs: {requeue_unknown: true, max_attempts: 3}
evaluation: {tier: standard, replicates: 4, duration_ms: 200, backend: mock, environment_id: synthetic-quiet-v0, target_rate_hz: 5.0}
fba: {data_dir: null, synthetic: true, synthetic_neurons: 2000}
checkpoint: {interval_s: 30}
stop: {timeout_s: 30}
mie: {interval_s: 1, collectors: [cpu, ram], anomaly: {gpu_temp_c: 85}}
env: {stim_fraction: 0.01, stim_rate_hz: 50}
traces: {store_full_for: [elite, novel, debug, explicit], dir: traces}
gui: {enabled: false}
functional_departure:
  enabled: true
  substrate_id: fba0
  severities: [0.1, 0.25, 0.5]
  controls: {founder: true, sham: true}
fitness:
  weights:
    # measured, never selected: the M1 selection mix is unchanged
    departure_resistance: 0.0
