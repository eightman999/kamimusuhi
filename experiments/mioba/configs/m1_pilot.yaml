# M1 Evolution Pilot — fast evolution, structural growth, disturbance and
# homeostasis on one shared FBA0 substrate.
#
# What M1 changes relative to M0 (see docs/experiments/m0-evolution-pilot-report.md):
#   - the evaluator is event-driven and the 139k/14M base is resident, so a
#     generation costs minutes rather than a quarter of an hour;
#   - every individual lives on the SAME FBA0 reference graph (fba.base_seed),
#     so genome differences are the only differences between organisms;
#   - children carry 2-3 mutations, mostly structural, with pruning;
#   - the episode is perturbed by seeded virtual disturbances, and what the
#     organism does about them is what is selected;
#   - selection runs on a combination of separated components, while the M0
#     placeholder stays in its own column so the runs remain comparable.
#
# This config is NOT the final M1 run. population.target_size,
# evolution.max_generations and worker.slots are decided from the measured
# generations/hour on the actual hardware (M1 §22) — run `mioba profile`,
# `mioba rank-check` and `mioba device-bench` first and write the numbers
# into the runbook before starting.
#
# Scientific sections (population, evolution, evaluation, fba, env,
# environment, fitness, dataset) are frozen under one experiment id, and now
# include the simulator's own semantics: changing the equations, the RNG
# protocol or the propagation path forces a new experiment id.

experiment: {id_prefix: "M1", runs_dir: "experiments/mioba/.runs"}

population: {target_size: 32}

evolution:
  max_generations: 20
  elite_k: 8
  mutation_seed: 20260911

  # M1 §3: M0 applied one mutation per child and moved nothing in nine
  # generations. 1 + Poisson(1.5) capped at 4 gives a mean near 2.4.
  mutation:
    count: {base: 1, poisson_lambda: 1.5, cap: 4}
    weights: {parameter: 0.35, structural: 0.55, prune: 0.10}
    limits: {artificial_neurons: 512, artificial_organs: 8, attachments: 24}
    new_organ_size: [8, 64]
    grow_organ_delta: [4, 32]
    # replaced by the §10 sensitivity sweep results before the real run:
    # parameters that do not move the phenotype get a lower draw weight
    # and insensitive ones get a wider scale range
    parameter_scale: [0.9, 1.1]
    parameter_scale_by_path: {}
    parameter_weights: {}

# One evaluation = one episode. The cheap evaluator is what generations are
# updated with; champions, anomalies and structural innovations are re-run on
# the gold evaluator (500 ms x 8) — see `mioba rank-check`, M1 §2.3/§21.
evaluation:
  tier: m1
  replicates: 4
  duration_ms: 500
  backend: torch
  environment_id: synthetic-quiet-v0
  target_rate_hz: 5.0
  # an evaluation activating more than this share of the connectome per step
  # is flagged: event-driven propagation stops paying off there (§2.4-4)
  activity_warn_edge_ratio: 0.05

# The shared reference graph. base_seed is part of the dataset identity
# (v1-n139000-e14000000-s20260911): every organism in this run lives here.
fba:
  data_dir: null
  synthetic: true
  synthetic_neurons: 139000
  synthetic_edges: 14000000
  base_seed: 20260911
  propagation_backend: event_csc     # event_csc | sparse_csr | auto
  dense_above: 0.05                  # only consulted when "auto"

# Task stimulus: which neurons the environment drives, and how hard.
env: {stim_fraction: 0.01, stim_rate_hz: 50}

# M1 §5-§7. Virtual, seeded, reproducible — never the host machine's real
# temperature or RAM (that stays telemetry; letting it in would make fitness
# depend on which GPU ran the job).
environment:
  enabled: true
  virtual:
    slices: 25
    sensor_neurons_per_channel: 64
    sensor_rate_hz: 80.0
    debt_decay: 0.9
    debt_gain: 1.0
    debt_terminate: 6.0
    use_physical_sensors: false
  disturbance:
    enabled: true
    # a quarter of episodes are undisturbed: the control condition lives
    # inside the run rather than beside it
    count_weights: {"0": 0.25, "1": 0.5, "2": 0.2, "3": 0.05}
    kind_weights: {thermal: 1.0, memory_squeeze: 1.0, sensor_dropout: 1.0,
                   sensor_noise: 1.0, latency_spike: 1.0}
    severity_weights: {mild: 0.5, medium: 0.35, severe: 0.15}
    onset_window: [0.2, 0.8]
    duration_frac: [0.1, 0.35]
    compound_probability: 0.25

# M1 §8-§9. Components are stored raw and combined here; weights can be
# changed and the run re-scored without re-simulating anything.
fitness:
  weights:
    task_score: 1.0
    homeostasis_score: 0.5
    disturbance_recovery_score: 0.8
    resource_efficiency_score: 0.4
    structural_functionality: 0.2
    novelty: 0.2
  # Below this normalised task quality the efficiency bonus is exactly
  # zero, so an organism that does nothing cannot win on cheapness.
  #
  # CALIBRATE THIS BEFORE THE RUN. task_quality = 1 - |rate - target|/target,
  # so 0.35 requires the population to fire within 3.25 Hz of the 5 Hz
  # target. M0 actually recorded every individual at ~0.497 Hz (the
  # "9.5 Hz" in the M0 report was a fitness->rate inversion artifact; see
  # the M1A report, section 7). M1A also showed the default regime is a
  # Poisson echo where genotype has no effect, so task_quality must be
  # re-measured on a non-degenerate operating regime before this gate is
  # set. The coordinator emits `efficiency_gate_inert` if a whole
  # generation falls below it anyway.
  minimum_viable_task_score: 0.35
  memory_cost_reference_bytes: 524288
  compute_cost_reference_edges: 5000.0
  novelty_neighbours: 5
  novelty_archive: 512

# Operational. slots/execution_batch change throughput, never results:
# set them from `mioba profile --slots 1,2,3` on each device.
worker: {execution_batch: 1, slots: 1, candidates: [1,2,4,8,16,32],
         vram_headroom: 0.85, bench_duration_ms: 200,
         bench_organ_overhead_neurons: 512,
         heartbeat_s: 5, lost_after_s: 90, grace_s: 30}

jobs: {requeue_unknown: true, max_attempts: 3}

checkpoint: {interval_s: 180}

stop: {timeout_s: 120}

mie: {interval_s: 5, collectors: [gpu, cpu, ram], anomaly: {gpu_temp_c: 85}}

traces: {store_full_for: [elite, novel, debug, explicit], dir: traces}

gui: {enabled: true, refresh_s: 2}
