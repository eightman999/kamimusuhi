[package]
name = "kamimusuhi-store-sqlite"
description = "SQLite single-writer canonical store for Kamimusuhi continuity state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
kamimusuhi-core = { workspace = true }
rusqlite = { workspace = true }
# Readback integrity compares exact JSON values, including f32 probabilities
# promoted to f64 in conversation traces. Preserve them across serialization.
serde_json = { workspace = true, features = ["float_roundtrip"] }

[dev-dependencies]
kamimusuhi-testkit = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
