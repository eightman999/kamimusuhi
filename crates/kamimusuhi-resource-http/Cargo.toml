[package]
name = "kamimusuhi-resource-http"
description = "Generic OpenAI-compatible HTTP cognitive-resource adapter for Kamimusuhi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
kamimusuhi-core = { workspace = true }
serde_json = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
# The fixture HTTP server: a real socket, so these tests exercise the real
# transport rather than a stubbed function boundary.
kamimusuhi-testkit = { workspace = true }
tempfile = { workspace = true }
# Generates the certificates the TLS fixture server presents: a private CA, a
# correct host certificate and a deliberately mismatched one.
rcgen = { workspace = true }

[lints]
workspace = true
