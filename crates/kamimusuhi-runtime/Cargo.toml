[package]
name = "kamimusuhi-runtime"
description = "Kamimusuhi runtime and model-independent K-CORE loop"
default-run = "kamimusuhi-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "kamimusuhi_runtime"
path = "src/lib.rs"

[[bin]]
name = "kamimusuhi-runtime"
path = "src/main.rs"

[[bin]]
name = "k-core"
path = "src/bin/k-core.rs"

[dependencies]
kamimusuhi-core = { workspace = true }
kamimusuhi-persona-http = { workspace = true }
kamimusuhi-resource-http = { workspace = true }
kamimusuhi-store-sqlite = { workspace = true }
# The deterministic fakes are the runtime's only cognitive resources in W4.
kamimusuhi-testkit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Raw row counts, read through an independent connection so the runtime's own
# view cannot mask what is on disk.
rusqlite = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
